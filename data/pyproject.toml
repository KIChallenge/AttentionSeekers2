[project]
name = "sv-data"
version = "0.1.0"
description = "Data corpus for the HealthPolicy Simulator: Begutachtungs-Stellungnahmen and health statistics"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pypdf>=5.0",
    "spacy>=3.8.18",
    "de-core-news-lg",
]

[tool.uv.sources]
de-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl" }
