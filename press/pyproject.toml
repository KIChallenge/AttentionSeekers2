[project]
name = "sv-press"
version = "0.1.0"
description = "DVSV press archive to person-free institution positions (press sources for the DB, persona SFT rows)"
requires-python = ">=3.12"
dependencies = [
    "spacy>=3.8.18",
    "de-core-news-lg",
    "openai>=1.60",
    "pyyaml>=6.0",
]

[project.scripts]
press-all = "sv_press.cli:main_all"
press = "sv_press.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
de-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sv_press"]

[tool.pytest.ini_options]
testpaths = ["tests"]
