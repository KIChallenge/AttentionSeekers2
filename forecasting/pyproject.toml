[project]
name = "svforecast"
version = "0.1.0"
description = "Reference-class outcome forecasting for Austrian health-policy drafts (Ministerialentwuerfe), labels from the public legislative record"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
svforecast = "svforecast.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svforecast"]
