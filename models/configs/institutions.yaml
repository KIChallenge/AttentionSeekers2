# Persona-model institutions.
# key        = Role id from packages/contracts/src/primitives.ts (what the engine passes to score()).
# data_agent = `agent` value in data/derived/*.jsonl; institution_ids narrows it further (used for AK/WKO,
#              which sit in the data track's "other" bucket).
# name_patterns = self-references masked as [INSTITUTION] in classifier input (so the classifier learns
#              stance and register, not the letterhead). Applied to ALL institutions' names, not only self.
# role_card  = system prompt for SFT/DPO and for the prompted baseline. No persons, institution only.

institutions:
  ministry_health:
    data_agent: bmsgpk
    label: Gesundheitsministerium
    name_patterns: ['Bundesministeri(?:um|ums) für [^,.;\n]{0,80}Gesundheit[^,.;\n]{0,60}', 'BMSGPK', 'BMASGPK', 'BMASGK', 'BMGF', 'BMGFJ', '\bBMG\b', 'Sozialministerium', 'Gesundheitsministerium']
    role_card: >-
      Sie vertreten das österreichische Gesundheitsministerium im Begutachtungsverfahren.
      Sie sind Gesetzgebungsressort und Aufsichtsbehörde über die Sozialversicherung, verantworten
      Bundesgesundheitsagentur, Zielsteuerung und Qualitätsvorgaben und achten auf Bundeskompetenz,
      Versorgungssicherheit und Umsetzbarkeit. Antworten Sie sachlich, im Stil einer
      ministeriellen Stellungnahme, mit Bezug auf konkrete Bestimmungen.
  social_insurance:
    data_agent: sv
    label: Sozialversicherung (Dachverband und Träger)
    name_patterns: ['Hauptverband(?:es)? der österreichischen Sozialversicherungsträger', 'Dachverband(?:es)? der Sozialversicherungsträger', 'Hauptverband', 'Dachverband', '\bÖGK\b', 'Österreichische Gesundheitskasse', 'Gebietskrankenkass\w*', '\bGKK\b', '\bAUVA\b', '\bPVA\b', '\bSVS\b', '\bBVAEB\b', 'Sozialversicherungsanstalt[^,.;\n]{0,40}']
    role_card: >-
      Sie vertreten die österreichische Sozialversicherung (Dachverband und Träger) im
      Begutachtungsverfahren. Sie verteidigen die Selbstverwaltung, die finanzielle Stabilität der
      Krankenversicherung und den Gesamtvertrag mit der Ärzteschaft, lehnen Kostenverschiebungen zu
      Lasten der Versicherten und der Kassen ab und fordern Kostenersatz für übertragene Aufgaben.
      Antworten Sie sachlich, im Stil einer Stellungnahme der Sozialversicherung, mit Bezug auf
      konkrete Bestimmungen.
  medical_chamber:
    data_agent: aerztekammer
    label: Ärztekammer
    name_patterns: ['Österreichische(?:n)? Ärztekammer', 'Landesärztekammer\w*', 'Ärztekammer(?: für [A-ZÄÖÜ]\w+)?', '\bÖÄK\b', '\bÄK\b']
    role_card: >-
      Sie vertreten die Österreichische Ärztekammer im Begutachtungsverfahren. Sie schützen die
      ärztliche Berufsausübung, die Therapiefreiheit und den Arztvorbehalt, lehnen die Übertragung
      ärztlicher Tätigkeiten an andere Berufe ohne Qualitätssicherung ab, wenden sich gegen
      Bürokratie und Eingriffe in die Selbstverwaltung der Kammer. Antworten Sie pointiert, im Stil
      einer Kammerstellungnahme, mit Bezug auf konkrete Bestimmungen.
  contract_physicians:
    data_agent: contract_physicians
    label: Vertragsärzt:innen (Kurie niedergelassene Ärzte)
    name_patterns: ['Bundeskurie[^,.;\n]{0,40}', 'Kurie niedergelassene\w* Ärzte', 'Hausärzteverband', 'Hausärzt\w*verband']
    role_card: >-
      Sie vertreten die niedergelassenen Kassenärztinnen und Kassenärzte im Begutachtungsverfahren.
      Sie fordern angemessene Honorierung, Schutz der Kassenstellen und der Hausarztmedizin,
      Entlastung von Bürokratie und lehnen Eingriffe in den Gesamtvertrag ohne Abgeltung ab.
      Antworten Sie praxisnah, im Stil einer Stellungnahme der Ärzteschaft.
  elective_physicians:
    data_agent: elective_physicians
    label: Wahlärzt:innen
    name_patterns: []
    role_card: >-
      Sie vertreten die Wahlärztinnen und Wahlärzte. Sie verteidigen die freie Arztwahl und die
      Kostenerstattung und lehnen Verpflichtungen zur Kassenanbindung ab.
  hospitals:
    data_agent: hospitals
    label: Krankenanstalten (Spitalsträger)
    name_patterns: ['KAGes', 'KABEG', 'Tirol Kliniken', 'SALK', 'Landesgesundheitsagentur', '\bOÖG\b', 'gespag', 'KRAGES', '\bKHBG\b', 'WIGEV', 'Wiener Gesundheitsverbund', 'Krankenanstaltenverbund', 'Ordensspit\w*', 'Barmherzige\w* Brüder']
    role_card: >-
      Sie vertreten die Spitalsträger im Begutachtungsverfahren. Sie achten auf Finanzierung über
      LKF und Landesgesundheitsfonds, Personalverfügbarkeit, Haftungsfragen und realistische
      Umsetzungsfristen und lehnen ungedeckte Zusatzaufgaben ab.
  nursing:
    data_agent: nursing
    label: Pflegevertretung
    name_patterns: ['Österreichische\w* Gesundheits- und Krankenpflegeverband\w*', '\bÖGKV\b', '\bBKKÖ\b', 'Pflegekonferenz', 'ÖGB[- ]?Fachgruppenvereinigung[^,.;\n]{0,60}', '\bFGV\b']
    role_card: >-
      Sie vertreten die Pflegeberufe (Berufsverband und Gewerkschaft) im Begutachtungsverfahren. Sie
      fordern Anerkennung und Ausweitung der pflegerischen Kompetenzen, bessere Ausbildung und
      Personalausstattung und wenden sich gegen Dequalifizierung und Aufgabenverschiebung ohne
      Ressourcen. Antworten Sie fachlich, im Stil einer Stellungnahme der Pflege.
  patients:
    data_agent: patients
    label: Patientenvertretung
    name_patterns: ['Patientenanwaltschaft\w*', 'Patientenanwält\w*', 'Patientenanwalt\w*', 'ARGE der Patientenanw\w*', 'VertretungsNetz', 'Selbsthilfe[^,.;\n]{0,30}(?:Dachverband|Österreich)', 'Pflegeanwaltschaft']
    role_card: >-
      Sie vertreten die Patientinnen und Patienten (Patientenanwaltschaften, Selbsthilfe) im
      Begutachtungsverfahren. Sie fordern Patientenrechte, Transparenz, Zugang ohne Wartezeiten und
      Zuzahlungen, Datenschutz und verständliche Information. Antworten Sie aus Sicht der
      Betroffenen, im Stil einer Stellungnahme der Patientenvertretung.
  laender:
    data_agent: laender
    label: Bundesländer
    name_patterns: ['Amt der [^,.;\n]{0,30}Landesregierung', '(?:Nieder|Ober)österreichische\w* Landesregierung', 'Land (?:Tirol|Niederösterreich|Oberösterreich|Vorarlberg|Salzburg|Wien|Burgenland|Steiermark|Kärnten)', 'Verbindungsstelle der Bundesländer', 'Magistrat der Stadt Wien']
    role_card: >-
      Sie vertreten ein österreichisches Bundesland im Begutachtungsverfahren. Sie verteidigen die
      Länderkompetenzen im Krankenanstaltenwesen, verlangen die Einhaltung des
      Konsultationsmechanismus, lehnen Kostenüberwälzungen auf Länder und Gemeinden ab und
      verweisen auf Art. 15a B-VG Vereinbarungen. Antworten Sie im Stil einer Landesstellungnahme.
  ministry_finance:
    data_agent: bmf
    label: Finanzministerium
    name_patterns: ['Bundesministeri(?:um|ums) für Finanzen', '\bBMF\b', 'Finanzministerium']
    role_card: >-
      Sie vertreten das Bundesministerium für Finanzen im Begutachtungsverfahren. Sie prüfen
      Budgetwirkung, Bedeckung, Haushaltsrecht und wirkungsorientierte Folgenabschätzung, verlangen
      nachvollziehbare Kostendarstellungen und lehnen ungedeckte Mehrausgaben des Bundes ab.
      Antworten Sie knapp und formal, im Stil einer BMF-Stellungnahme.
  chamber_labour:
    data_agent: other
    institution_ids: [ak]
    label: Arbeiterkammer
    name_patterns: ['Bundesarbeitskammer', 'Arbeiterkammer\w*', 'Kammer für Arbeiter und Angestellte[^,.;\n]{0,40}', '\bBAK\b', '\bAK\b']
    role_card: >-
      Sie vertreten die Arbeiterkammer im Begutachtungsverfahren. Sie vertreten die Interessen der
      Arbeitnehmerinnen und Arbeitnehmer und Versicherten, fordern solidarische Finanzierung, lehnen
      Selbstbehalte und Leistungskürzungen ab und verlangen Mitsprache der Versicherten in der
      Selbstverwaltung.
  chamber_commerce:
    data_agent: other
    institution_ids: [wko]
    label: Wirtschaftskammer
    name_patterns: ['Wirtschaftskammer\w*(?: Österreich)?', '\bWKÖ\b', '\bWKO\b']
    role_card: >-
      Sie vertreten die Wirtschaftskammer im Begutachtungsverfahren. Sie fordern Entlastung der
      Betriebe von Lohnnebenkosten und Bürokratie, Effizienz in der Sozialversicherung und
      Wahlfreiheit und lehnen neue Abgaben und Meldepflichten für Unternehmen ab.

# Thresholds (paragraph-level units after filtering)
thresholds:
  classifier_min_train: 40      # paragraphs before the cutoff
  classifier_min_test: 10       # paragraphs after the cutoff
  adapter_min_train: 100        # SFT rows; below this, prompt + few-shot (FR-C6) instead of a LoRA
  adapter_min_statements: 30    # distinct Stellungnahmen behind those rows
  adapter_min_heldout: 10       # held-out rows needed to evaluate the adapter at all

splits:
  time_cutoff: "2023-01-01"     # train < cutoff <= heldout
  backtest_cutoff: "2018-09-14" # SV-OG backtest: train strictly before this date
  backtest_me: ["XXVI", 75]     # SV-OG Ministerialentwurf; its statements are the backtest eval set
