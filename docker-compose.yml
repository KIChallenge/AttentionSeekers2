services:
  db:
    image: pgvector/pgvector:pg17
    container_name: sv-pg
    environment:
      POSTGRES_USER: sv
      POSTGRES_PASSWORD: sv
      POSTGRES_DB: sv
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - sv-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sv -d sv"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  sv-pg-data:
